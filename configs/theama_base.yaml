# SPDX-License-Identifier: Apache-2.0
# Theama base configuration — Film + Avatar + Image lines

model:
  video_backbone: "Wan-AI/Wan2.2-T2V-A14B"   # MoE 27B total / 14B active, Apache-2.0
  video_backbone_dev: "Wan-AI/Wan2.2-TI2V-5B" # 24GB-friendly dev/CI path
  avatar_backbone: "Wan-AI/Wan2.2-Animate-2-14B" # Apache-2.0; Wan-Animate-2 base, animation-only
  image_backbone: "Qwen/Qwen-Image-2512"      # 20B T2I quality base, Apache-2.0
  image_backbone_fast: "Tongyi-MAI/Z-Image-Turbo" # 6B, 8 NFE, Apache-2.0 dev/draft path
  image_edit: "Qwen/Qwen-Image-Edit-2511"     # multi-reference editing, Apache-2.0
  text_encoder: "umt5-xxl"                    # shipped with Wan 2.2
  video_vae: "wan2.2-3d-causal-vae"
  audio:
    codec: "dac-44.1khz"                      # Descript Audio Codec latent
    sample_rate: 44100
    channels: 2
    dit:
      layers: 12
      dim: 1024
      heads: 16
      bridge_every: 3                         # bidirectional A/V cross-attention every N layers

generation:
  fps: 24
  native_seconds: 5
  target_seconds: 30                          # via THEAMA-Extend (5s x 6 segments)
  extend:
    anchor_frames: 8                          # tail frames reused as continuation anchor
    audio_crossfade_ms: 250
  stages:
    - { name: "base",    width: 1280, height: 720 }
    - { name: "regen2k", width: 2560, height: 1440, denoise_strength: 0.35 }
    - { name: "regen4k", width: 3840, height: 2160, denoise_strength: 0.25, tiled: true }

export:
  container: "mp4"
  video_codec: "h264"                         # h265 optional
  audio_codec: "aac"
  audio_bitrate: "192k"

training:
  objective: "flow_matching"
  schedule: "logit_normal"
  method: "lora_first"                        # LoRA on A/V bridge layers, then full FT
  precision: "bf16"
  forbid_third_party_outputs: true            # never train on H3/LTX outputs (license)

eval:
  prompt_set: "eval/t2v_v1.jsonl"             # fixed 50-prompt T2V set (M1)
  vbench_subset: ["subject_consistency", "background_consistency", "motion_smoothness",
                  "dynamic_degree", "aesthetic_quality", "imaging_quality"]
  reference: "eval/reference.json"            # AMD BF16 0.8681 @ 832x480/81f/16fps/30 steps
  tolerance: 0.02
