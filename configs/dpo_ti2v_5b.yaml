# P1a: LoRA-DPO on Wan 2.2 TI2V-5B (dev/CI path; A14B config comes after the
# 5B pipeline is green end-to-end).
dpo:
  base_model: ti2v-5b
  reward_model: videoreward          # src/theama/reward/config.py registry
  candidates_per_prompt: 4           # gen_candidates.py
  pair_margin: 0.5                   # min VideoReward overall gap (best-worst)
  lora:
    rank: 32
    alpha: 32
    dropout: 0.0
    target_modules: [to_q, to_k, to_v, to_out.0]
  train:
    lr: 1.0e-5
    beta: 500                        # ViPO-style video DPO scale
    steps: 500
    batch_pairs: 1
    grad_accum: 8
    save_every: 100
    seed: 42
    mixed_precision: bf16
  # Acceptance (docs/training-plan.md P1a):
  # - blind win rate vs base Wan 2.2 >= 65% on held-out prompts
  # - VBench 6-dim subset within +-0.01 of the pre-DPO baseline
  gates:
    blind_win_rate_vs_base: 0.65
    vbench_tolerance: 0.01
