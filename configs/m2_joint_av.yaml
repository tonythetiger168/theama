# SPDX-License-Identifier: Apache-2.0
# M2 defaults; external real-weight GPU smoke passed, internal-block GPU smoke is pending.
model:
  audio:
    codec: dac_44k  # MIT, hop 512, 1024-dim continuous latents, mid/side stereo
    dim: 1024
    layers: 12
    heads: 16
    video_dim: 16  # active A14B VAE latent channels; use 48 for the TI2V-5B dev path
    bridge_every: 3
    latent_dim: 2048  # direct mid+side DAC tokens (2 * 1024), no learned compressor
  video:
    adapter: t2v-a14b
    dev_adapter: ti2v-5b
    repo_id: Wan-AI/Wan2.2-T2V-A14B-Diffusers
    dev_repo: Wan-AI/Wan2.2-TI2V-5B-Diffusers
    latent_channels: 16
    dev_latent_channels: 48
    text_dim: 4096
    timestep_scale: 1000
    bridge_location: latent_pre_backbone  # wan_blocks = internal path; set audio.video_dim to Wan inner dim
    frozen: true
training:
  phase: bridge  # bridge warmup first; set_phase("full") for full-audio FT
  bridge_lora_rank: 8  # bridge warmup trains low-rank residuals only; 0 = dense warmup
  bridge_lora_alpha: 16
  lr: 0.0001
  weight_decay: 0.01
  audio_loss_weight: 1.0
  video_loss_weight: 1.0
  max_grad_norm: 1.0
  mu: 0.0
  sigma: 1.0
  time_scale: 1000.0
  cfg_dropout: 0.1  # CFG text-cond dropout (null rows) — enables modality-aware CFG at inference
acceptance:
  av_sync_offset_ms_max: 40
  human_belonging_score_min: 7
  clip_seconds: 5
